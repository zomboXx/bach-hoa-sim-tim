server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/simtim}
    username: ${DB_USER:simtim}
    password: ${DB_PASSWORD:simtim-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
    time-zone: Asia/Ho_Chi_Minh
app:
  seed-demo: ${SEED_DEMO:true}
  demo-password: ${DEMO_PASSWORD:demo123}
