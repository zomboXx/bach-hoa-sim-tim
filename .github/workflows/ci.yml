name: baseline-quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check committed whitespace
        run: git show --check --format=oneline HEAD
      - name: Check repository policy
        shell: pwsh
        run: ./scripts/check-repository-policy.ps1
      - name: Check local Markdown links
        shell: pwsh
        run: ./scripts/check-markdown-links.ps1

  web-baseline:
    name: Web baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Configure browser dependency downloads
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo grep -l "packages.microsoft.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo rm -rf /var/lib/apt/lists/*
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-browser-ci-network >/dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-failure
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  api-bootstrap:
    name: API bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - run: ./mvnw verify

  qa02-live:
    name: QA-02 live ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [gap05, gap06, pos, transfer]
    env:
      POSTGRES_PASSWORD: qa02-db-${{ github.run_id }}-${{ github.run_attempt }}
      SIMTIM_DEMO_PASSWORD: qa02-user-${{ github.run_id }}-${{ github.run_attempt }}
      TRANSFER_ENABLED: ${{ matrix.suite == 'transfer' && 'true' || 'false' }}
      TRANSFER_ORGANIZATION_ID: 10000000-0000-0000-0000-000000000001
      TRANSFER_STORE_ID: 10000000-0000-0000-0000-000000000002
      TRANSFER_BANK_BIN: '970436'
      TRANSFER_ACCOUNT_NUMBER: '0000000000'
      TRANSFER_ACCOUNT_NAME: TEST ONLY - DO NOT TRANSFER
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Configure browser dependency downloads
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo grep -l "packages.microsoft.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo rm -rf /var/lib/apt/lists/*
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-browser-ci-network >/dev/null
      - name: Install web and browser dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start clean API and PostgreSQL
        run: docker compose -f infra/compose.demo.yml up --build -d --wait postgres api
      - name: Capture database baseline
        shell: bash
        run: |
          for attempt in {1..30}; do
            seeded_receipts=$(docker compose -f infra/compose.demo.yml exec -T postgres \
              psql -U simtim -d simtim -Atc \
              "select count(*) from inventory.goods_receipts where organization_id = '10000000-0000-0000-0000-000000000001' and store_id = '10000000-0000-0000-0000-000000000002'")
            if [ "$seeded_receipts" -ge 1 ]; then
              break
            fi
            sleep 1
          done
          test "$seeded_receipts" -ge 1
          baseline=$(docker compose -f infra/compose.demo.yml exec -T postgres \
            psql -U simtim -d simtim -At -F '|' \
            < scripts/qa02-gap06-db-summary.sql)
          echo "QA02_DB_BASELINE=$baseline" >> "$GITHUB_ENV"
      - name: Run live QA-02 flow
        working-directory: apps/web
        env:
          API_PROXY_TARGET: http://127.0.0.1:8080
          SIMTIM_LIVE_PASSWORD: ${{ env.SIMTIM_DEMO_PASSWORD }}
        run: |
          if [ "${{ matrix.suite }}" = pos ]; then
            npm run test:e2e:live:pos
          elif [ "${{ matrix.suite }}" = transfer ]; then
            npm run test:e2e:live:transfer
          else
            npm run test:e2e:live:qa02-${{ matrix.suite }}
          fi
      - name: Verify independent database oracle
        shell: bash
        run: |
          after=$(docker compose -f infra/compose.demo.yml exec -T postgres \
            psql -U simtim -d simtim -At -F '|' \
            < scripts/qa02-gap06-db-summary.sql)
          IFS='|' read -r before_receipts before_invoices before_payments before_sale_movements _ before_revenue \
            <<< "$QA02_DB_BASELINE"
          IFS='|' read -r after_receipts after_invoices after_payments after_sale_movements mismatches after_revenue \
            <<< "$after"
          if [ "${{ matrix.suite }}" = gap05 ]; then
            expected_receipts=0
            expected_sales=2
          elif [ "${{ matrix.suite }}" = gap06 ]; then
            expected_receipts=1
            expected_sales=1
          else
            expected_receipts=0
            expected_sales=1
          fi
          test $((after_receipts - before_receipts)) -eq "$expected_receipts"
          test $((after_invoices - before_invoices)) -eq "$expected_sales"
          test $((after_payments - before_payments)) -eq "$expected_sales"
          test $((after_sale_movements - before_sale_movements)) -eq "$expected_sales"
          test $((after_revenue - before_revenue)) -gt 0
          test "$mismatches" -eq 0
          if [ "${{ matrix.suite }}" = transfer ]; then
            transfer_oracle=$(docker compose -f infra/compose.demo.yml exec -T postgres \
              psql -U simtim -d simtim -Atc "select count(*)=1 and bool_and(status='COMPLETED' and resolved_by is not null and bank_reference='LIVE-TRANSFER-001') from sales.transfer_orders; select coalesce(sum(reserved_quantity),0)=0 from inventory.inventory_balances;")
            test "$transfer_oracle" = $'t\nt'
          fi
          printf 'QA-02 %s DB oracle: receipt_delta=%s; invoice_delta=%s; payment_delta=%s; sale_movement_delta=%s; revenue_delta=%s; balance_mismatches=0\n' \
            '${{ matrix.suite }}' "$expected_receipts" "$expected_sales" "$expected_sales" "$expected_sales" "$((after_revenue - before_revenue))"
      - name: Upload transfer browser evidence
        if: always() && matrix.suite == 'transfer'
        uses: actions/upload-artifact@v4
        with:
          name: manual-transfer-browser
          path: apps/web/test-results/live
          if-no-files-found: ignore
      - name: Show logs on failure
        if: failure()
        run: docker compose -f infra/compose.demo.yml logs --tail=120 postgres api
      - name: Stop clean stack
        if: always()
        run: docker compose -f infra/compose.demo.yml down -v

  demo-compose:
    name: Demo Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-db-${{ github.run_id }}-${{ github.run_attempt }}
      SIMTIM_DEMO_PASSWORD: ci-user-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and start demo
        run: docker compose -f infra/compose.demo.yml up --build -d --wait
      - name: Smoke test web and API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:5174/
          printf '{"organizationCode":"SIMTIM","storeCode":"MAIN","username":"manager","password":"%s"}' "$SIMTIM_DEMO_PASSWORD" |
            curl --fail --silent --show-error -o /dev/null \
              -H 'Content-Type: application/json' --data-binary @- \
              http://127.0.0.1:5174/api/v1/auth/login
      - name: Show demo logs on failure
        if: failure()
        run: docker compose -f infra/compose.demo.yml logs --tail=100
      - name: Stop demo
        if: always()
        run: docker compose -f infra/compose.demo.yml down
