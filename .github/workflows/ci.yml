name: baseline-quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check committed whitespace
        run: git show --check --format=oneline HEAD
      - name: Check repository policy
        shell: pwsh
        run: ./scripts/check-repository-policy.ps1
      - name: Check local Markdown links
        shell: pwsh
        run: ./scripts/check-markdown-links.ps1

  web-baseline:
    name: Web baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-failure
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  api-bootstrap:
    name: API bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - run: ./mvnw verify

  demo-compose:
    name: Demo Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-db-${{ github.run_id }}-${{ github.run_attempt }}
      SIMTIM_DEMO_PASSWORD: ci-user-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and start demo
        run: docker compose -f infra/compose.demo.yml up --build -d --wait
      - name: Smoke test web and API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:5174/
          printf '{"organizationCode":"SIMTIM","storeCode":"MAIN","username":"manager","password":"%s"}' "$SIMTIM_DEMO_PASSWORD" |
            curl --fail --silent --show-error -o /dev/null \
              -H 'Content-Type: application/json' --data-binary @- \
              http://127.0.0.1:5174/api/v1/auth/login
      - name: Show demo logs on failure
        if: failure()
        run: docker compose -f infra/compose.demo.yml logs --tail=100
      - name: Stop demo
        if: always()
        run: docker compose -f infra/compose.demo.yml down
