name: Báo lỗi
description: Lỗi chức năng, dữ liệu, giao diện hoặc kiểm thử
title: "[BUG] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Môi trường
      placeholder: "Branch/commit, trình duyệt, thiết bị"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Log hoặc bằng chứng

