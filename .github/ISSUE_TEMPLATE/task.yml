name: Công việc hoặc tính năng
description: Công việc có kết quả, phạm vi và tiêu chí chấp nhận rõ ràng.
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: Mỗi Issue có một owner chính, một reviewer và phải đủ Definition of Ready trước khi chuyển sang Ready.
  - type: dropdown
    id: priority
    attributes:
      label: Ưu tiên
      options: [P0, P1, P2]
    validations:
      required: true
  - type: input
    id: backlog
    attributes:
      label: Backlog item
      description: Mã backlog hoặc liên kết quyết định nguồn.
      placeholder: BE-01
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Kết quả cần đạt
      description: Mô tả hành vi hoặc đầu ra có thể quan sát, không chỉ liệt kê file sẽ sửa.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Phạm vi và ngoài phạm vi
      placeholder: |
        Trong phạm vi:
        - ...

        Ngoài phạm vi:
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Tiêu chí chấp nhận
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Phụ thuộc và ảnh hưởng
      description: Issue bị block, contract, migration, module hoặc dữ liệu bị ảnh hưởng; ghi N/A nếu không có.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Kế hoạch kiểm thử
      description: Lệnh tự động và tình huống thủ công dự kiến dùng để chứng minh kết quả.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: "@github-user"
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      placeholder: "@github-user"
    validations:
      required: true
