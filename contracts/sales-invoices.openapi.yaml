openapi: 3.1.0
info:
  title: Sim Tim sales invoices and checkout
  version: 0.1.0
  x-status: Working Draft
  x-draft-date: '2026-10-01'
  description: >-
    Working Draft for SAL-01 (Issue #21 / PR #26).
    Owner API: TV3 (Nguyễn Văn Thi); Reviewers: TV2 (Nguyễn Văn Trung) for inventory boundary
    and TV1 (Nguyễn Đức Phát) for wire routes and RBAC alignment.
    Covers quote preview, atomic CASH checkout with FEFO allocation, and invoice query.
servers:
  - url: /
security:
  - bearerSession: []
paths:
  /api/v1/sales/quote:
    post:
      operationId: quoteSale
      summary: Preview sales quote and calculated totals
      description: >-
        Calculates prices from catalog.product_prices and returns line items with subtotal.
        Read-only computation; does not lock inventory or mutate database state.
        Permitted for any authenticated role with sales.read.
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteRequest'}
      responses:
        '200':
          description: Calculated quote preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuoteResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /api/v1/sales/checkout:
    post:
      operationId: checkoutSaleDirect
      summary: Checkout CASH sale (alias for /api/v1/sales/invoices)
      description: Alias matching the Sprint 2 boundary route standard. Identical behavior to POST /api/v1/sales/invoices.
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckoutRequest'}
      responses:
        '201':
          description: Invoice created and inventory deducted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Insufficient stock balance for required FEFO allocation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Validation failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/v1/sales/invoices:
    post:
      operationId: checkoutSale
      summary: Checkout CASH sale, generate invoice and deduct inventory atomically
      description: >-
        Executes an atomic checkout transaction:
        1. Validates cashAmount >= calculated grandTotal.
        2. Allocates available batches using FEFO order (earliest expiry first).
        3. Creates sales.invoices, sales.invoice_lines, sales.invoice_line_batches.
        4. Deducts inventory.inventory_balances with pessimistic lock.
        5. Records inventory.stock_movements (SALE type, negative delta).
        6. Records sales.payments (CASH, COMPLETED).
        Requires sales.write authority (SALES, MANAGER, ADMIN).
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckoutRequest'}
      responses:
        '201':
          description: Invoice created and inventory deducted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Insufficient stock balance for required FEFO allocation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Validation failure (e.g. cashAmount less than grandTotal)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

    get:
      operationId: listInvoices
      summary: List invoices of a store
      description: Returns invoices within the store scope. Requires sales.read authority.
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: storeId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: List of store invoices
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/InvoiceResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/sales/invoices/{id}:
    get:
      operationId: getInvoice
      summary: Get invoice by ID
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Invoice found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Invoice not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: Opaque 43-character token from /api/v1/auth/login

  responses:
    InvalidRequest:
      description: Malformed JSON or header validation failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: Missing, invalid or expired Bearer token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: User lacks required permission code in store scope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableEntity:
      description: Business constraint violation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    CheckoutItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: {type: string, format: uuid}
        quantity: {type: number, minimum: 0.001, description: 'Quantity up to 3 decimal places'}

    QuoteRequest:
      type: object
      required: [storeId, items]
      properties:
        storeId: {type: string, format: uuid}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CheckoutItemRequest'}

    QuoteLineResponse:
      type: object
      required: [productId, productName, quantity, unitPrice, lineTotal]
      properties:
        productId: {type: string, format: uuid}
        productName: {type: string}
        quantity: {type: number}
        unitPrice: {type: integer, description: 'Integer VND unit price'}
        lineTotal: {type: integer, description: 'Integer VND line total'}

    QuoteResponse:
      type: object
      required: [storeId, lines, subtotal, grandTotal]
      properties:
        storeId: {type: string, format: uuid}
        lines:
          type: array
          items: {$ref: '#/components/schemas/QuoteLineResponse'}
        subtotal: {type: integer, description: 'Integer VND'}
        grandTotal: {type: integer, description: 'Integer VND'}

    CheckoutRequest:
      type: object
      required: [storeId, items, cashAmount]
      properties:
        storeId: {type: string, format: uuid}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CheckoutItemRequest'}
        cashAmount: {type: integer, minimum: 0, description: 'Customer cash tendered in VND'}

    InvoiceLineBatchResponse:
      type: object
      required: [productBatchId, quantity]
      properties:
        productBatchId: {type: string, format: uuid}
        quantity: {type: number}

    InvoiceLineResponse:
      type: object
      required: [id, productId, sku, productName, quantity, unitPrice, discountAmount, lineTotal]
      properties:
        id: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        sku: {type: string}
        productName: {type: string}
        quantity: {type: number}
        unitPrice: {type: integer}
        discountAmount: {type: integer}
        lineTotal: {type: integer}
        appliedPromotionId: {type: string, format: uuid, nullable: true}
        appliedPromotionCode: {type: string, nullable: true}
        appliedPromotionName: {type: string, nullable: true}
        promotionDiscountType: {type: string, enum: [AMOUNT, PERCENT], nullable: true}
        promotionDiscountValue: {type: number, nullable: true}
        batches:
          type: array
          items: {$ref: '#/components/schemas/InvoiceLineBatchResponse'}

    PaymentResponse:
      type: object
      required: [id, method, status, amount, paidAt]
      properties:
        id: {type: string, format: uuid}
        method: {type: string, enum: [CASH, TRANSFER, CARD, OTHER]}
        status: {type: string, enum: [PENDING, COMPLETED, FAILED, REFUNDED]}
        amount: {type: integer}
        paidAt: {type: string, format: date-time}

    InvoiceResponse:
      type: object
      required: [id, organizationId, storeId, invoiceNo, status, soldBy, soldAt, subtotal, discountTotal, grandTotal, paidTotal, lines, payments]
      properties:
        id: {type: string, format: uuid}
        organizationId: {type: string, format: uuid}
        storeId: {type: string, format: uuid}
        invoiceNo: {type: string}
        status: {type: string, enum: [DRAFT, COMPLETED, VOIDED]}
        soldBy: {type: string, format: uuid}
        soldAt: {type: string, format: date-time}
        subtotal: {type: integer}
        discountTotal: {type: integer}
        grandTotal: {type: integer}
        paidTotal: {type: integer}
        changeAmount: {type: integer}
        lines:
          type: array
          items: {$ref: '#/components/schemas/InvoiceLineResponse'}
        payments:
          type: array
          items: {$ref: '#/components/schemas/PaymentResponse'}

    Error:
      type: object
      required: [status, code, message]
      properties:
        status: {type: integer}
        code: {type: string}
        message: {type: string}
