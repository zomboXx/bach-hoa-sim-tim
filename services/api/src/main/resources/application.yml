spring:
  application:
    name: sim-tim-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/simtim}
    username: ${DB_USER:simtim}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
